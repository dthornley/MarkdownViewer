          div.innerHTML = svg; bindFunctions?.(div);
        } catch (e) {
          div.innerHTML = `<div class="mermaid-error">Mermaid error: ${md.utils.escapeHtml(String(e.message || e))}</div><pre><code>${md.utils.escapeHtml(code)}</code></pre>`;
          document.querySelectorAll('body > svg[id^="dmmd"], body > div[id^="dmmd"]').forEach(n => n.remove());
        }
        return div;
      }));
      if (renderId !== mermaidGen) return; // a newer render superseded this one
      blocks.forEach((pre, i) => pre.replaceWith(divs[i]));
    }

    if (keep) content.scrollTop = scrollTop; // diagrams change the layout height, so restore again
    else if (location.hash) { const el = document.getElementById(decodeURIComponent(location.hash.slice(1))); el?.scrollIntoView(); }
    document.dispatchEvent(new CustomEvent('mdv-rendered'));
  }

  function showError(msg) { errEl.textContent = msg; errEl.style.display = 'block'; $('#content').scrollTop = 0; }

  // ---------- TOC ----------
  function buildToc() {
    const hs = [...out.querySelectorAll('h1, h2, h3, h4')];
    toc.innerHTML = '';
    if (hs.length < 2) { toc.classList.add('hidden'); return; }
    hs.forEach(h => {
      const a = document.createElement('a');
      a.href = '#' + h.id; a.textContent = h.textContent.replace(/#$/, '').trim(); a.className = 'l' + h.tagName[1];
      toc.appendChild(a);
    });
    if (localStorage.getItem('mdv-toc') !== 'hidden') toc.classList.remove('hidden');
    const links = toc.querySelectorAll('a');
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(en => { if (en.isIntersecting) {
        links.forEach(l => l.classList.toggle('active', l.getAttribute('href') === '#' + en.target.id));
      }});
    }, { root: $('#content'), rootMargin: '0px 0px -75% 0px' });
    hs.forEach(h => obs.observe(h));
  }

  // ---------- Loading ----------
  function setTitle(name) {
    state.fileName = name; titleEl.innerHTML = '';
    titleEl.append(name || 'Markdown Viewer');
    document.title = name ? `${name} – Markdown Viewer` : 'Markdown Viewer';
    window.__TAURI__?.window.getCurrentWindow().setTitle(name || 'Markdown Viewer');
  }
  async function loadFile(file, handle, keep) {
    state.handle = handle || null; state.baseUrl = null;
    setTitle(file.name);
    render(await file.text(), keep);
  }
  async function loadUrl(url, keep) {
    try {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      state.baseUrl = new URL(url, location.href).href;
      setTitle(decodeURIComponent(url.split('/').pop().split('?')[0]));
      render(await res.text(), keep);
    } catch (e) { showError(`Could not load ${url}: ${e.message}`); }
  }

  $('#file-input').addEventListener('change', (e) => { if (e.target.files[0]) loadFile(e.target.files[0]); e.target.value = ''; });

  // Use File System Access API when available so "Reload" can re-read the file.
  if (window.showOpenFilePicker) {
    $('label.btn').addEventListener('click', async (e) => {
      e.preventDefault();
      try {
        const [handle] = await showOpenFilePicker({ types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md', '.markdown', '.mdown', '.mkd'], 'text/plain': ['.txt'] } }] });
        loadFile(await handle.getFile(), handle);
      } catch (err) { if (err.name !== 'AbortError') showError(err.message); }
    });
  }

  // Drag & drop
  ['dragenter', 'dragover'].forEach(ev => addEventListener(ev, e => { e.preventDefault(); document.body.classList.add('dragging'); }));
  ['dragleave', 'drop'].forEach(ev => addEventListener(ev, e => { e.preventDefault(); document.body.classList.remove('dragging'); }));
  addEventListener('drop', async (e) => {
    const item = e.dataTransfer.items?.[0];
    if (item?.getAsFileSystemHandle) {
      const h = await item.getAsFileSystemHandle();
      if (h.kind === 'file') return loadFile(await h.getFile(), h);
    }
    const f = e.dataTransfer.files[0]; if (f) loadFile(f);
  });

  // Paste raw markdown
  addEventListener('paste', (e) => {
    const text = e.clipboardData.getData('text/plain');
    if (text && !e.target.closest('input, textarea')) { state.handle = null; state.baseUrl = null; setTitle('Pasted Markdown'); render(text); }
  });

  // Toolbar
  async function reload() {
    if (state.handle) loadFile(await state.handle.getFile(), state.handle, true);
    else if (state.baseUrl) loadUrl(state.baseUrl, true);
    else if (state.source) render(state.source, true);
  }
  $('#btn-reload').addEventListener('click', reload);
  $('#btn-toc').addEventListener('click', () => {
    toc.classList.toggle('hidden'); localStorage.setItem('mdv-toc', toc.classList.contains('hidden') ? 'hidden' : 'shown');
  });
  $('#btn-theme').addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));
  $('#btn-print').addEventListener('click', () => print());

  // Page zoom (View menu in the app; the browser's own zoom covers served mode)
  let zoom = Number(localStorage.getItem('mdv-zoom')) || 1;
  function setZoom(z) {
    zoom = Math.min(3, Math.max(0.5, Math.round(z * 100) / 100));
    document.documentElement.style.setProperty('--zoom', zoom);
    localStorage.setItem('mdv-zoom', zoom);
    const el = $('#zoom'); el.textContent = `${Math.round(zoom * 100)}%`; el.style.display = zoom === 1 ? 'none' : 'inline';
  }
  $('#zoom').addEventListener('click', () => setZoom(1));
  setZoom(zoom);

  // Lightbox: click a diagram or image to view it full-window with pan and zoom.
  const lightbox = $('#lightbox'), stage = lightbox.querySelector('.stage'), lbLabel = lightbox.querySelector('.bar span');
  let lb = { scale: 1, x: 0, y: 0, w: 0, h: 0 };
  function lbApply() {
    stage.style.transform = `translate(${lb.x}px, ${lb.y}px) scale(${lb.scale})`;
    lbLabel.textContent = `${Math.round(lb.scale * 100)}%`;
  }
  function lbFit() {
    const vw = lightbox.clientWidth, vh = lightbox.clientHeight;
    lb.scale = Math.min(4, (vw - 80) / lb.w, (vh - 80) / lb.h);
    lb.x = (vw - lb.w * lb.scale) / 2; lb.y = (vh - lb.h * lb.scale) / 2; lbApply();
  }
  function lbZoom(factor, cx = lightbox.clientWidth / 2, cy = lightbox.clientHeight / 2) {
    const s = Math.min(16, Math.max(0.1, lb.scale * factor));
    // keep the point under the cursor fixed
    lb.x = cx - (cx - lb.x) * (s / lb.scale); lb.y = cy - (cy - lb.y) * (s / lb.scale); lb.scale = s; lbApply();
  }
  function openLightbox(el) {
    const node = el.cloneNode(true);
    stage.replaceChildren(node);
    if (node.tagName.toLowerCase() === 'svg') {
      // Mermaid sizes its svg with max-width and a viewBox; render it at its natural size and scale from there.
      const vb = node.viewBox?.baseVal, natural = parseFloat(node.style.maxWidth) || vb?.width || el.clientWidth;
      lb.w = natural; lb.h = vb && vb.width ? natural * vb.height / vb.width : el.clientHeight * natural / el.clientWidth;
      node.setAttribute('width', lb.w); node.setAttribute('height', lb.h); node.style.maxWidth = 'none'; node.removeAttribute('class');
    } else { lb.w = el.naturalWidth || el.clientWidth; lb.h = el.naturalHeight || el.clientHeight; node.removeAttribute('width'); node.removeAttribute('height'); }
    lightbox.classList.add('open'); lbFit();
  }
  const closeLightbox = () => { lightbox.classList.remove('open'); stage.replaceChildren(); };
  out.addEventListener('click', (e) => {
    if (e.target.closest('a[href]') || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    const el = e.target.closest('.mermaid svg, img');
    if (el) { e.preventDefault(); openLightbox(el); }
  });
  lightbox.querySelector('.bar').addEventListener('click', (e) => {
    const z = e.target.dataset.z; if (!z) return;
    if (z === 'in') lbZoom(1.25); else if (z === 'out') lbZoom(0.8); else if (z === 'fit') lbFit(); else closeLightbox();
  });
  lightbox.addEventListener('wheel', (e) => { e.preventDefault(); lbZoom(e.deltaY < 0 ? 1.1 : 1 / 1.1, e.clientX, e.clientY); }, { passive: false });
  lightbox.addEventListener('dblclick', (e) => { if (!e.target.closest('.bar')) lbFit(); });
  let pan = null;
  lightbox.addEventListener('pointerdown', (e) => { if (e.target.closest('.bar') || e.button !== 0) return; pan = { x: e.clientX - lb.x, y: e.clientY - lb.y }; lightbox.classList.add('panning'); lightbox.setPointerCapture(e.pointerId); });
  lightbox.addEventListener('pointermove', (e) => { if (!pan) return; lb.x = e.clientX - pan.x; lb.y = e.clientY - pan.y; lbApply(); });
  lightbox.addEventListener('pointerup', () => { pan = null; lightbox.classList.remove('panning'); });
  lightbox.addEventListener('pointercancel', () => { pan = null; lightbox.classList.remove('panning'); });
  addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox(); else if (e.key === '+' || e.key === '=') lbZoom(1.25); else if (e.key === '-') lbZoom(0.8); else if (e.key === '0') lbFit(); else return;
    e.preventDefault(); e.stopImmediatePropagation();
  }, true);
  addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey || e.target.matches('input, textarea')) return;
    if (e.key === 'r') reload(); else if (e.key === 't') $('#btn-toc').click();
    else if (e.key === 'd') $('#btn-theme').click(); else if (e.key === 'p') { e.preventDefault(); print(); }
  });

  // ---------- Served mode (mdview): in-viewer navigation between .md files ----------
  const MD_EXT = /\.(md|markdown|mdown|mkd)$/i;
  let lastMtime = null; // mtime of state.fileParam as last seen by the poll below
  let es = null;
  // (Re)subscribe to change events for the file currently shown; called again after in-viewer navigation.
  function watchServedFile() {
    if (!window.EventSource || !state.fileParam) return;
    es?.close();
    es = new EventSource(`/__events?file=${encodeURIComponent(state.fileParam)}`);
    let opened = false;
    es.addEventListener('open', () => { if (opened) loadUrl(state.fileParam, true); opened = true; }); // reconnect after server restart
    es.addEventListener('message', (e) => { try { if (JSON.parse(e.data).type === 'change') loadUrl(state.fileParam, true); } catch {} });
  }
  // Show another file from the served root in place. `rel` is relative to the server root.
  function openServedFile(rel, hash = '', push = true) {
    state.fileParam = rel; lastMtime = null; watchServedFile();
    if (push) history.pushState({ file: rel }, '', `${location.pathname}?file=${encodeURIComponent(rel)}${hash}`);
    if (!hash) $('#content').scrollTop = 0;
    loadUrl(rel);
  }
  // Intercept left-clicks on relative .md links so they open in the viewer instead of as raw text.
  out.addEventListener('click', (e) => {
    const a = e.target.closest('a[href]');
    if (!a || !out.contains(a) || !state.fileParam) return;
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || a.target === '_blank') return;
    const raw = a.getAttribute('href');
    if (!raw || /^(https?:|mailto:|[a-z][a-z0-9+.-]*:|\/\/|#)/i.test(raw)) return;
    let u;
    try { u = new URL(raw, new URL(state.fileParam, location.href)); } catch { return; }
    if (u.origin !== location.origin) return;
    let rel;
    if (u.pathname === location.pathname && u.searchParams.has('file')) rel = u.searchParams.get('file'); // already rewritten by link_open
    else if (MD_EXT.test(u.pathname)) { try { rel = decodeURIComponent(u.pathname).replace(/^\/+/, ''); } catch { return; } }
    else return;
    // Leave anything that is not a plain path inside the served root to the browser.
    if (!rel || !MD_EXT.test(rel) || rel.split('/').some(seg => seg === '..' || seg === '')) return;
    e.preventDefault();
    if (rel === state.fileParam) { if (u.hash) location.hash = u.hash; else openServedFile(rel, '', false); return; }
    openServedFile(rel, u.hash, true);
  });
  // Back/forward: load whatever file the URL now names.
  addEventListener('popstate', () => {
    if (!state.fileParam) return;
    const rel = new URLSearchParams(location.search).get('file');
    if (rel && rel !== state.fileParam) openServedFile(rel, location.hash, false);
  });

  // ---------- Desktop app (Tauri shell) ----------
  // Documents are fetched through the app's mdv:// protocol, so loadUrl and the relative-URL
  // resolution above work unchanged; only opening, watching and link clicks differ.
  const tauri = window.__TAURI__;
  if (tauri) {
    const { invoke } = tauri.core, { listen } = tauri.event;
    const isWin = navigator.platform.startsWith('Win');
    const MDV = isWin ? 'http://mdv.localhost/' : 'mdv://localhost';
    const toUrl = (abs) => MDV + abs.replace(/\\/g, '/').split('/').map(encodeURIComponent).join('/');
    const fromUrl = (u) => { const p = decodeURIComponent(new URL(u).pathname); return isWin ? p.replace(/^\//, '') : p; };
    let lastOpen = { path: null, at: 0 }, changeTimer = null;
    // Back/forward history for this window: every document shown here, with where it was scrolled to.
    const nav = { back: [], fwd: [] };
    const navHere = () => state.baseUrl && { path: fromUrl(state.baseUrl), hash: location.hash, scroll: $('#content').scrollTop };
    const updateNav = () => { $('#btn-back').disabled = !nav.back.length; $('#btn-fwd').disabled = !nav.fwd.length; };
    document.body.classList.add('has-nav');
    async function openPath(abs, entry) {
      if (abs === lastOpen.path && Date.now() - lastOpen.at < 1000) return; // launch can deliver the same file twice
      lastOpen = { path: abs, at: Date.now() };
      const here = navHere();
      if (!entry && here && here.path !== abs) { nav.back.push(here); nav.fwd = []; }
      updateNav();
      state.handle = null;
      if (entry) document.addEventListener('mdv-rendered', () => { $('#content').scrollTop = entry.scroll; }, { once: true });
      await loadUrl(toUrl(abs));
      invoke('watch_file', { path: abs }).catch(e => showError(String(e)));
    }
    function goBack() { const e = nav.back.pop(); if (!e) return; const here = navHere(); if (here) nav.fwd.push(here); location.hash = e.hash; openPath(e.path, e); }
    function goForward() { const e = nav.fwd.pop(); if (!e) return; const here = navHere(); if (here) nav.back.push(here); location.hash = e.hash; openPath(e.path, e); }
    $('#btn-back').addEventListener('click', goBack);
    $('#btn-fwd').addEventListener('click', goForward);
    addEventListener('mouseup', (e) => { if (e.button === 3) { e.preventDefault(); goBack(); } else if (e.button === 4) { e.preventDefault(); goForward(); } });
    // Native dialog instead of <input type=file>; the Rust side loads the file into this window if it is empty, else into a new one.
    const pick = () => invoke('open_dialog');
    $('label.btn').addEventListener('click', (e) => { e.preventDefault(); e.stopImmediatePropagation(); pick(); }, true);
    // Links to local files: Markdown opens in the app (also when written without the .md extension or
    // as a file:// URL), anything else opens in its default app; web links go to the default browser.
    out.addEventListener('click', async (e) => {
      const a = e.target.closest('a[href]');
      if (!a || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      let href = a.href;
      if (/^file:/i.test(href)) href = toUrl(decodeURIComponent(new URL(href).pathname)) + new URL(href).hash;
      if (href.startsWith(MDV)) {
        e.preventDefault();
        const u = new URL(href), abs = fromUrl(href), current = state.baseUrl && fromUrl(state.baseUrl);
        if (abs === current) { // same document: just jump to the heading
          location.hash = u.hash; document.getElementById(decodeURIComponent(u.hash.slice(1)))?.scrollIntoView(); return;
        }
        if (MD_EXT.test(u.pathname)) { location.hash = u.hash; openPath(abs); return; }
        if (!/\.[a-z0-9]+$/i.test(u.pathname)) {
          const md = await fetch(`${u.origin}${u.pathname}.md`, { cache: 'no-store' }).catch(() => null);
          if (md?.ok) { location.hash = u.hash; openPath(abs + '.md'); return; }
        }
        tauri.opener.openPath(abs).catch(err => showError(`Could not open ${abs}: ${err}`));
      } else if (/^(https?:|mailto:)/i.test(href)) { e.preventDefault(); tauri.opener.openUrl(href); }
    });
    // Files: Finder / Dock / command line, drag and drop, change notifications, menu.
    listen('open-file', (e) => { location.hash = ''; openPath(e.payload); });
    // Theme and TOC choices are shared between windows through localStorage.
    addEventListener('storage', (e) => { if (e.key === 'mdv-theme' && e.newValue && e.newValue !== theme) applyTheme(e.newValue); });
    listen('tauri://drag-enter', () => document.body.classList.add('dragging'));
    listen('tauri://drag-leave', () => document.body.classList.remove('dragging'));
    listen('tauri://drag-drop', (e) => { document.body.classList.remove('dragging'); const p = e.payload.paths?.[0]; if (p) { location.hash = ''; openPath(p); } });
    listen('file-changed', () => { clearTimeout(changeTimer); changeTimer = setTimeout(() => { if (state.baseUrl) loadUrl(state.baseUrl, true); }, 100); });
    listen('menu', (e) => {
      const id = e.payload;
      if (id === 'open') pick(); else if (id === 'reload') reload(); else if (id === 'print') print();
      else if (id === 'toc') $('#btn-toc').click(); else if (id === 'theme') $('#btn-theme').click();
      else if (id === 'update') checkForUpdates(true);
      else if (id === 'back') goBack(); else if (id === 'forward') goForward();
      else if (id === 'zoom-in') setZoom(zoom + 0.1); else if (id === 'zoom-out') setZoom(zoom - 0.1); else if (id === 'zoom-reset') setZoom(1);
    });
    invoke('take_pending_file').then(p => { if (p) openPath(p); });

    // Updates: GitHub Releases publishes latest.json (see scripts/release.sh); the updater plugin
    // verifies the archive signature against the public key in tauri.conf.json before installing.
    const updateEl = $('#update');
    function showUpdate(text, buttons = []) {
      updateEl.textContent = text;
      for (const [label, fn] of buttons) { const b = document.createElement('button'); b.textContent = label; b.onclick = fn; updateEl.append(b); }
      updateEl.style.display = 'block';
    }
    const hideUpdate = () => { updateEl.style.display = 'none'; };
    async function checkForUpdates(manual) {
      let update;
      try { update = await tauri.updater.check(); }
      catch (e) {
        if (manual) await tauri.dialog.message(`Could not check for updates.\n\n${e}`, { title: 'Check for Updates', kind: 'error' });
        else tauri.log?.warn(`update check failed: ${e}`);
        return;
      }
      if (!update) { if (manual) await tauri.dialog.message('Markdown Viewer is up to date.', { title: 'Check for Updates', kind: 'info' }); return; }
      const notes = (update.body || '').trim();
      const install = await tauri.dialog.ask(
        `Markdown Viewer ${update.version} is available (you have ${update.currentVersion}).` + (notes ? `\n\n${notes.length > 600 ? notes.slice(0, 600) + '…' : notes}` : '') + '\n\nInstall it now? The app will relaunch when done.',
        { title: 'Update Available', kind: 'info', okLabel: 'Install and Relaunch', cancelLabel: 'Later' });
      if (!install) return;
      try {
        let total = 0, got = 0;
        showUpdate('Downloading update…');
        await update.downloadAndInstall((ev) => {
          if (ev.event === 'Started') total = ev.data.contentLength || 0;
          else if (ev.event === 'Progress') { got += ev.data.chunkLength; showUpdate(total ? `Downloading update… ${Math.round(got / total * 100)}%` : 'Downloading update…'); }
          else if (ev.event === 'Finished') showUpdate('Installing…');
        });
        await tauri.process.relaunch();
      } catch (e) { showUpdate(`Update failed: ${e}`, [['Close', hideUpdate]]); }
    }
    // Debug builds (the only ones with the log plugin) skip the launch check so development isn't nagged about releases.
    if (!tauri.log) setTimeout(() => checkForUpdates(false), 3000);
    // Debug builds attach the log plugin; one line per render makes `npm run app:dev` easy to follow.
    document.addEventListener('mdv-rendered', () => tauri.log?.info(`rendered ${state.baseUrl || state.fileName || 'pasted'}: ${out.querySelectorAll('h1,h2,h3').length} headings, ${out.querySelectorAll('.mermaid svg').length} diagrams, ${out.querySelectorAll('.katex').length} math, ${out.querySelectorAll('img').length} images, failed libs: ${window.__mdvFailed.length}`));
  }

  // Auto-refresh when served by mdview (server-sent events, falling back to mtime polling)
  const params = new URLSearchParams(location.search);
  const fileParam = params.get('file');
  if (fileParam) {
    state.fileParam = fileParam;
    // The browser's history is the navigation history here; the toolbar buttons just drive it.
    document.body.classList.add('has-nav');
    $('#btn-back').disabled = $('#btn-fwd').disabled = false;
    $('#btn-back').addEventListener('click', () => history.back());
    $('#btn-fwd').addEventListener('click', () => history.forward());
    loadUrl(fileParam);
    if (window.EventSource) {
      watchServedFile();
    } else {
      setInterval(async () => {
        try {
          const r = await fetch(`/__mtime?file=${encodeURIComponent(state.fileParam)}`, { cache: 'no-store' });
          if (!r.ok) return;
          const { mtime } = await r.json();
          if (lastMtime !== null && mtime !== lastMtime) loadUrl(state.fileParam, true);
          lastMtime = mtime;
        } catch {}
      }, 1000);
    }
  }
  addEventListener('hashchange', () => { const el = document.getElementById(decodeURIComponent(location.hash.slice(1))); el?.scrollIntoView(); });
})();
</script>
</body>
</html>
