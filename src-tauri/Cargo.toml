[package]
name = "markdown-viewer"
version = "1.0.0"
description = "A simple, friendly Markdown viewer with GFM, Mermaid, math and syntax highlighting"
authors = ["David Thornley"]
license = "MIT"
repository = "https://github.com/dthornley/MarkdownViewer"
edition = "2021"
rust-version = "1.80"

[lib]
name = "markdown_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
log = "0.4"
notify = "8"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
